
<!-- demo:back-top/basic -->
<h3>基本用法</h3>
<p>当容器滚动到一定高度的时候，在右下角会出现一个返回顶部的按钮。</p>
<template data-demo-source>
<template>
  <div class="wrapper">
    <ul id="basic-demo">
      <li v-for="(_, index) of Array(40)" :key="index">This is the content</li>
    </ul>
    <a-back-top
      target-container="#basic-demo"
      :style="{ position: 'absolute' }"
    />
  </div>
</template>

<style scoped src="/demo/styles/examples/back-top/basic.css"></style>
</template>
<!-- /demo -->


<!-- demo:back-top/custom -->
<h3>自定义按钮</h3>
<p>可以自定义返回按钮。</p>
<template data-demo-source>
<template>
  <div class="wrapper">
    <ul id="custom-demo">
      <li v-for="(_, index) of Array(40)" :key="index">This is the content</li>
    </ul>
    <a-back-top
      target-container="#custom-demo"
      :style="{ position: 'absolute' }"
    >
      <a-button>UP</a-button>
    </a-back-top>
  </div>
</template>

<style scoped src="/demo/styles/examples/back-top/custom.css"></style>
</template>
<!-- /demo -->

<h2 id="api">API</h2>
<h3 id="back-top-props"><code>&lt;back-top&gt;</code> Props</h3>
<table>
<thead>
<tr>
<th>参数名</th>
<th>描述</th>
<th>类型</th>
<th style="text-align:center">默认值</th>
</tr>
</thead>
<tbody>
<tr>
<td>visible-height</td>
<td>显示回到顶部按钮的触发滚动高度</td>
<td><code>number</code></td>
<td style="text-align:center"><code>200</code></td>
</tr>
<tr>
<td>target-container</td>
<td>滚动事件的监听容器</td>
<td><code>string | HTMLElement</code></td>
<td style="text-align:center"><code>-</code></td>
</tr>
<tr>
<td>easing</td>
<td>滚动动画的缓动方式，可选值参考 <a href="https://github.com/PengJiyuan/b-tween">BTween</a></td>
<td><code>string</code></td>
<td style="text-align:center"><code>'quartOut'</code></td>
</tr>
<tr>
<td>duration</td>
<td>滚动动画的持续时间</td>
<td><code>number</code></td>
<td style="text-align:center"><code>200</code></td>
</tr>
</tbody>
</table>
