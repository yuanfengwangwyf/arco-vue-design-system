<h2 id="切换到暗黑模式">切换到暗黑模式</h2>
<p>组件库通过 body 标签上的 arco-theme 属性来标明当前的主题，所以你只要修改这个属性，即可完成主题的切换。</p>
<pre><code class="language-ts">// 设置为暗黑主题
document.body.setAttribute('arco-theme', 'dark')

// 恢复亮色主题
document.body.removeAttribute('arco-theme');
</code></pre>
<h2 id="原理和内置颜色">原理和内置颜色</h2>
<p>可参考 <a href="https://arco.design/react/docs/palette">暗黑模式</a> 和 <a href="https://arco.design/react/docs/palette">颜色</a></p>
