
<!-- demo:overflow-list/basic -->
<h3>基本使用</h3>
<p>折叠列表的基本使用方法。</p>
<template data-demo-source>
<template>
  <a-form auto-label-width>
    <a-form-item label="Tag Number">
      <a-input-number
        v-model="number"
        :min="0"
        :max="20"
        style="width: 200px"
      />
    </a-form-item>
    <a-form-item label="List Width">
      <a-slider v-model="width" :min="0" :max="800" />
    </a-form-item>
  </a-form>
  <div :style="{ width: `${width}px`, marginTop: '20px' }">
    <a-overflow-list>
      <div>DIV Element</div>
      <a-tag v-for="item of tags" :key="item">Tag{{ item }}</a-tag>
    </a-overflow-list>
  </div>
</template>

<script setup>
import { computed, ref } from "vue";
const width = ref(500);
const number = ref(10);
const tags = computed(
  () => Array.from({ length: number.value }, (_, idx) => idx + 1)
);
</script>
</template>
<!-- /demo -->


<!-- demo:overflow-list/from -->
<h3>折叠方向</h3>
<p>通过 <code>from</code> 属性可以设置折叠的方向。</p>
<template data-demo-source>
<template>
  <a-form auto-label-width>
    <a-form-item label="Tag Number">
      <a-input-number
        v-model="number"
        :min="0"
        :max="20"
        style="width: 200px"
      />
    </a-form-item>
    <a-form-item label="List Width">
      <a-slider v-model="width" :min="0" :max="800" />
    </a-form-item>
  </a-form>
  <div :style="{ width: `${width}px`, marginTop: '20px' }">
    <a-overflow-list from="start">
      <div>DIV Element</div>
      <a-tag v-for="item of tags" :key="item">Tag{{ item }}</a-tag>
    </a-overflow-list>
  </div>
</template>

<script setup>
import { computed, ref } from "vue";
const width = ref(500);
const number = ref(10);
const tags = computed(
  () => Array.from({ length: number.value }, (_, idx) => idx + 1)
);
</script>
</template>
<!-- /demo -->
